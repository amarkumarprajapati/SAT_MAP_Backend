services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sat_map_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=true
    volumes:
      - .:/app
      - cache_data:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sat_map_net

volumes:
  cache_data:
    driver: local

networks:
  sat_map_net:
    driver: bridge
